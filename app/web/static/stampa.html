<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Stampa – Tablatore AI</title>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@{{ALPHATAB}}/dist/alphaTab.min.js"></script>
<script>window.ALPHATAB_VERSIONE = "{{ALPHATAB}}";</script>
<script src="/static/esporta.js?v={{V}}"></script>
<style>
  @page { size: A4; margin: 12mm; }
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; color: #1d2330; }
  .foglio { max-width: 186mm; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .dati { font-size: 12px; color: #444; margin: 0 0 4px; }
  .nota { font-size: 10px; color: #777; margin: 0 0 10px; }
  #righi img { display: block; width: 100%; break-inside: avoid; page-break-inside: avoid; }
  #attesa { color: #777; }
  @media print { #attesa { display: none; } }
  @media screen { body { background: #e9ebef; } .foglio { background: #fff; padding: 12mm; margin: 10px auto; } }
</style>
</head>
<body>
<div class="foglio">
  <h1 id="titolo">Tablatura</h1>
  <p class="dati" id="dati"></p>
  <p class="nota">Trascrizione automatica e approssimativa: verificare a orecchio. Solo per uso personale e di studio.</p>
  <p id="attesa">Preparo le pagine…</p>
  <div id="righi"></div>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const id = q.get("lavoro");
  if (!/^[0-9a-f]{32}$/.test(id || "")) { document.getElementById("attesa").textContent = "Lavoro non valido."; return; }
  const stato = await (await fetch(`/api/lavori/${id}`)).json();
  const r = stato.risultato;
  document.title = `${stato.titolo} – tablatura`;
  document.getElementById("titolo").textContent = stato.titolo;
  document.getElementById("dati").textContent =
    `Accordatura ${r.accordatura} · ${Math.round(r.bpm)} BPM · ${r.metro} · tonalità ${r.tonalita || "—"} · ${r.numero_battute} battute`;
  const dati = new Uint8Array(await (await fetch(r.file["tablatura_verificata.gp5"] + `?v=${Date.now()}`)).arrayBuffer());
  const LARGHEZZA = 700, NITIDEZZA = 2;
  const pezzi = await disegnaSuCanvas(dati, { larghezza: LARGHEZZA, nitidezza: NITIDEZZA, profilo: q.get("vista") || "Tab" });
  const righi = document.getElementById("righi");
  for (const p of pezzi) {
    const img = new Image();
    img.src = p.canvas.toDataURL("image/png");
    // stessa proporzione del disegno originale: un pezzo stretto (es. la firma finale) non va allargato
    img.style.width = `${100 * p.w / (LARGHEZZA * NITIDEZZA)}%`;
    img.style.marginLeft = `${100 * p.x / (LARGHEZZA * NITIDEZZA)}%`;
    righi.appendChild(img);
  }
  await Promise.all([...righi.querySelectorAll("img")].map(i => i.decode()));
  document.getElementById("attesa").remove();
  document.title = "PRONTO";            // segnale per le prove automatiche
  document.title = `${stato.titolo} – tablatura`;
  if (q.get("stampa") !== "0") setTimeout(() => window.print(), 300);
})();
</script>
</body>
</html>
